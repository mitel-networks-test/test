# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Configuration
spring.application.name=three-tier-backend
logging.level.com.example.threetier=INFO

# Database Configuration (for RDS MySQL) - disabled for demo
# spring.datasource.url=jdbc:mysql://localhost:3306/app_db?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=app_user
# spring.datasource.password=secure_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - disabled for demo
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Disable auto configuration for database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*